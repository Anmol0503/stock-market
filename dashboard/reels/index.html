<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="theme-color" content="#0c0e13">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-status-bar-style" content="black-translucent">
<meta name="apple-mobile-web-app-title" content="Briefing">
<meta name="description" content="The Morning Briefing: five big stories explained in depth, with short reels, briefs for every section and a 3-question quiz.">
<title>The Briefing</title>
<link rel="manifest" href="./manifest.json">
<link rel="icon" href="./icon-192.png">
<link rel="apple-touch-icon" href="./icon-180.png">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="./app.css">
<script>
  /* Apply theme + text size before first paint (no flash). Prefs moved from digest_prefs to briefing_prefs. */
  (function(){ var p={}; try{ p=JSON.parse(localStorage.getItem('briefing_prefs')||localStorage.getItem('digest_prefs'))||{}; }catch(e){}
    var dark=window.matchMedia && matchMedia('(prefers-color-scheme: dark)').matches;
    document.documentElement.dataset.theme=(p.theme==='dark'||p.theme==='light')?p.theme:(dark?'dark':'light');
    document.documentElement.style.setProperty('--tsz', p.size||1); })();
</script>
</head>
<body>

<header id="hdr">
  <div class="brand">
    <div class="logo" aria-hidden="true"><svg class="i" width="19" height="19" viewBox="0 0 24 24"><path d="M4 22h16a2 2 0 0 0 2-2V4a2 2 0 0 0-2-2H8a2 2 0 0 0-2 2v16a2 2 0 0 1-2 2Zm0 0a2 2 0 0 1-2-2v-9c0-1.1.9-2 2-2h2"/><path d="M18 14h-8"/><path d="M15 18h-5"/><path d="M10 6h8v4h-8V6Z"/></svg></div>
    <button class="wm" data-act="calendar" aria-label="Pick a day"><b>The Briefing</b><span id="sub">Loading…</span></button>
    <button class="icb" data-act="calendar" aria-label="Pick a day"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><rect x="3" y="4" width="18" height="18" rx="3"/><path d="M16 2v4M8 2v4M3 10h18"/></svg></button>
    <button class="icb" id="refresh" data-act="refresh" aria-label="Check for a newer edition"><svg class="i" width="18" height="18" viewBox="0 0 24 24"><path d="M21 12a9 9 0 1 1-2.64-6.36"/><path d="M21 3v6h-6"/></svg></button>
    <button class="icb aa" data-act="display" aria-label="Theme and text size"><span>Aa</span></button>
  </div>
  <div id="late" hidden></div>
  <nav id="tabs" aria-label="Sections"></nav>
  <div id="prog"></div>
</header>

<main id="deck"><div class="empty"><div class="spinner"></div>Loading today’s briefing…</div></main>

<!-- Explainer: full-screen reading sheet, rendered lazily when opened -->
<div id="ex" role="dialog" aria-modal="true" aria-label="Explainer" hidden><div class="ex-scroll" id="exScroll"></div></div>

<!-- Bottom sheet: calendar + display settings -->
<div id="mask" data-act="sheet-close"></div>
<div id="sheet" role="dialog" aria-modal="true" aria-labelledby="stitle">
  <div class="grab"></div>
  <div class="bar"><h3 id="stitle"></h3>
    <button class="x" data-act="sheet-close" aria-label="Close"><svg class="i" width="16" height="16" viewBox="0 0 24 24"><path d="M18 6 6 18M6 6l12 12"/></svg></button></div>
  <div id="sbody"></div>
</div>

<!-- Play all: full-screen story-style player (filled in by player.js) -->
<div id="pa" role="dialog" aria-modal="true" aria-label="Play all reels" hidden></div>

<div id="toast" role="status" aria-live="polite"></div>

<script src="./player.js"></script>
<script src="./app.js"></script>
</body>
</html>
