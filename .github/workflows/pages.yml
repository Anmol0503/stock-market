name: Deploy to GitHub Pages

# Replaces the flaky legacy Pages builder (and its "deployment failed" emails).
# Publishes the repo as-is on every push to main.
on:
  push:
    branches: [main]
  workflow_dispatch: {}

permissions:
  contents: read
  pages: write
  id-token: write

concurrency:
  group: pages
  cancel-in-progress: true

jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deployment.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Bring in recent reels (stored as release assets, never in git)
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          # Only the last 2 days, and only the reels each manifest lists (a re-published day leaves old files in
          # its release). Older reels play from the release URL (fallback_src). Keeps each deploy small and fast.
          for f in $(ls -1 dashboard/briefing/videos/*.json 2>/dev/null | sort | tail -2); do
            d=$(basename "$f" .json)
            mkdir -p "dashboard/media/$d"
            pats=$(python3 -c "import json,sys,os; m=json.load(open(sys.argv[1])); print(' '.join(f\"-p {os.path.basename(i[k])}\" for i in m.get('items',[]) for k in ('src','poster') if i.get(k)))" "$f")
            [ -n "$pats" ] && { gh release download "briefing-$d" -R "${{ github.repository }}" -D "dashboard/media/$d" \
              $pats --clobber || echo "no reels for $d yet"; }
          done
          du -sh dashboard/media 2>/dev/null || true
      - uses: actions/upload-pages-artifact@v3
        with:
          path: .
      - id: deployment
        uses: actions/deploy-pages@v4
        with:
          timeout: 1800000
